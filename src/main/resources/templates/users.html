<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <!--/*/ <th:block th:insert="~{fragments/headerinc :: head}"></th:block> /*/-->
</head>
<body>
<!--/*/ <th:block th:insert="~{fragments/header :: header}"></th:block> /*/-->
<div class="container-fluid">
    <h2>Users</h2>
    <a th:href="@{/users/new}" class="btn btn-success"><i class="fa fa-plus"></i> Add User</a>
    <br><br>
    <table class="table table-striped">
        <tr>
            <th>Username</th>
            <th>Role</th>
            <th class="text-center">Actions</th>
        </tr>
        <tr th:each="user : ${users}">
            <td th:text="${user.username}"></td>
            <td th:text="${user.role}"></td>
            <td class="col-actions">
                <a th:href="@{/users/{id}(id=${user.id})}" class="btn btn-default"><i class="fa fa-eye"></i> Show</a>
                <a th:href="@{/users/edit/{id}(id=${user.id})}" class="btn btn-primary"><i class="fa fa-edit"></i> Edit</a>
                <form th:action="@{/users/delete/{id}(id=${user.id})}" method="post" style="display:inline;">
                    <input type="submit" value="Delete" class="btn btn-danger" onclick="return confirm('Are you sure you want to remove?')" />
                </form>
            </td>
        </tr>
    </table>
</div>
</body>
</html>
